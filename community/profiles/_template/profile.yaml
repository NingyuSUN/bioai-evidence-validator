id: ppi-template
version: "0.1.0"
description: >-
  Template: synthetic protein-protein interaction curation. Copy and replace; not a
  recommended policy for real interaction data.
predicates: [physically_interacts_with]
subject_types: [protein]
object_types: [protein]
uses:
  pathway_draft:
    required_evidence_types: [interaction_assay]
    require_human_acceptance: false
    allow_llm_only: false
    allow_string_match_only: false
  curated_network:
    required_evidence_types: [interaction_assay]
    require_human_acceptance: true
    allow_llm_only: false
    allow_string_match_only: false
