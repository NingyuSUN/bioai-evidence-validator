id: https://w3id.org/bioevidence/core
name: bioevidence_core
title: BioEvidence operational core
description: Domain-neutral evidence records for biological assertions, source provenance,
  scoped adjudication, and use-specific admission.
license: Apache-2.0
version: 0.4.0
prefixes:
  bioev: https://w3id.org/bioevidence/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
  sepio: http://purl.obolibrary.org/obo/SEPIO_
default_prefix: bioev
default_range: string
imports:
- linkml:types
enums:
  AgentType:
    permissible_values:
      human: null
      software: null
      organization: null
  SourceType:
    permissible_values:
      ontology_snapshot: null
      registry_snapshot: null
      dataset_snapshot: null
      publication: null
      web_page: null
      local_file: null
  EvidenceDirection:
    permissible_values:
      supports: null
      contradicts: null
      neutral: null
  ExtractionMethod:
    permissible_values:
      deterministic_parser: null
      manual_curation: null
      normalized_string_match: null
      llm_extraction: null
  StatementStatus:
    permissible_values:
      proposed: null
      accepted: null
      rejected: null
      superseded: null
  AdjudicationDecision:
    permissible_values:
      accept: null
      reject: null
      defer: null
  FindingSeverity:
    permissible_values:
      error: null
      review: null
      warning: null
  AdmissionStatus:
    permissible_values:
      admitted: null
      review_required: null
      rejected: null
      not_evaluated: null
slots:
  id:
    pattern: \S
    identifier: true
    range: uriorcurie
    required: true
  name:
    range: string
  agent_type:
    range: AgentType
    required: true
  title:
    pattern: \S
    range: string
    required: true
  source_type:
    range: SourceType
    required: true
  uri:
    range: uri
  version:
    pattern: \S
    range: string
    required: true
  retrieved_at:
    range: datetime
    required: true
  sha256:
    range: string
    pattern: ^[0-9a-f]{64}$
    required: true
  observed_sha256:
    range: string
    pattern: ^[0-9a-f]{64}$
  source_artifact_id:
    pattern: \S
    range: uriorcurie
    required: true
  locator:
    pattern: \S
    range: string
    required: true
  extracted_text:
    range: string
  evidence_type:
    pattern: \S
    range: string
    required: true
  extraction_method:
    range: ExtractionMethod
    required: true
  created_by:
    range: Agent
    inlined: true
  evidence_item_ids:
    pattern: \S
    required: true
    range: uriorcurie
    multivalued: true
    minimum_cardinality: 1
  direction:
    range: EvidenceDirection
    required: true
  rationale:
    pattern: \S
    range: string
  evidence_lines:
    required: true
    range: EvidenceLine
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  statement_status:
    range: StatementStatus
    required: true
  decision:
    range: AdjudicationDecision
    required: true
  reviewer:
    range: Agent
    inlined: true
    required: true
  decided_at:
    range: datetime
    required: true
  rule_id:
    range: string
    required: true
  severity:
    range: FindingSeverity
    required: true
  message:
    range: string
    required: true
  field_path:
    range: string
  blocking_uses:
    range: string
    multivalued: true
  use:
    range: string
    required: true
  admission_status:
    range: AdmissionStatus
    required: true
  reason_codes:
    range: string
    multivalued: true
  record_id:
    identifier: true
    range: string
    pattern: \S
    required: true
  profile_id:
    range: string
    pattern: \S
    required: true
  statement:
    range: Statement
    inlined: true
    required: true
  source_artifacts:
    range: SourceArtifact
    inlined: true
    required: true
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
  evidence_items:
    range: EvidenceItem
    inlined: true
    required: true
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 1
  adjudications:
    range: Adjudication
    inlined: true
    multivalued: true
    inlined_as_list: true
    minimum_cardinality: 0
  requested_uses:
    range: string
    pattern: \S
    required: true
    multivalued: true
    minimum_cardinality: 1
  subject:
    range: Entity
    inlined: true
    required: true
  object:
    range: Entity
    inlined: true
    required: true
  label:
    range: string
    pattern: \S
    required: true
  entity_type:
    range: string
    pattern: \S
    required: true
  predicate:
    range: string
    pattern: \S
    required: true
  scope:
    range: string
    pattern: \S
    required: true
    multivalued: true
    minimum_cardinality: 1
  statement_id:
    range: string
    pattern: \S
    required: true
  applies_to_uses:
    range: string
    pattern: \S
    required: true
    multivalued: true
    minimum_cardinality: 1
classes:
  Agent:
    class_uri: prov:Agent
    slots:
    - id
    - name
    - agent_type
  SourceArtifact:
    description: Immutable description of the exact source bytes used by a decision.
    class_uri: prov:Entity
    slots:
    - id
    - title
    - source_type
    - uri
    - version
    - retrieved_at
    - sha256
    - observed_sha256
  EvidenceItem:
    description: A located, typed unit of evidence extracted from one source artifact.
    slots:
    - id
    - source_artifact_id
    - locator
    - extracted_text
    - evidence_type
    - extraction_method
    - created_by
    - scope
  EvidenceLine:
    description: An explicit supporting, contradicting, or neutral evidence relationship.
    slots:
    - id
    - direction
    - evidence_item_ids
    - rationale
  Statement:
    slots:
    - id
    - subject
    - predicate
    - object
    - scope
    - evidence_lines
    - statement_status
    - created_by
  Adjudication:
    description: A human decision that never overwrites the underlying evidence or
      findings.
    slots:
    - id
    - statement_id
    - applies_to_uses
    - decision
    - reviewer
    - rationale
    - decided_at
    slot_usage:
      rationale:
        required: true
  Finding:
    slots:
    - rule_id
    - severity
    - message
    - field_path
    - blocking_uses
  UseDecision:
    slots:
    - use
    - admission_status
    - reason_codes
  Entity:
    description: A domain entity with caller-supplied stable identity and type.
    slots:
    - id
    - label
    - entity_type
  BioEvidenceRecord:
    tree_root: true
    slots:
    - record_id
    - profile_id
    - statement
    - source_artifacts
    - evidence_items
    - adjudications
    - requested_uses
