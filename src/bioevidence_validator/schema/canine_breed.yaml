id: https://w3id.org/bioevidence/canine-breed
name: canine_breed
title: Canine breed evidence profile
description: >-
  Profile for validating canine breed catalog concepts, aliases, source-label
  assignments, and explicitly typed breed relationships.
license: Apache-2.0
version: 0.2.0

prefixes:
  bioev: https://w3id.org/bioevidence/
  linkml: https://w3id.org/linkml/
  VBO: http://purl.obolibrary.org/obo/VBO_

default_prefix: bioev
default_range: string
imports:
  - linkml:types
  - bioevidence_core

enums:
  BreedStatementType:
    permissible_values:
      breed_catalog:
      name_equivalence:
      source_label_assignment:
      breed_relationship:
  BreedPredicate:
    permissible_values:
      denotes_breed:
      maps_to_breed:
      exact_synonym_of:
      official_rename_of:
      translation_of:
      regional_population_of:
      variety_of:
      represented_by:
      related_but_not_equivalent:
  BreedConceptStatus:
    permissible_values:
      current:
      obsolete:
      unresolved:
  BreedScope:
    permissible_values:
      breed:
      regional_population:
      variety:
      landrace:
      mixed_breed:
      extinct_breed:
      unknown:
  RequestedUse:
    permissible_values:
      reference_catalog:
      display_name:
      source_sample_mapping:
      frequency_label_mapping:
      training_label:
      external_validation_label:

slots:
  record_id:
    identifier: true
    range: uriorcurie
    required: true
  statement:
    range: BreedStatement
    inlined: true
    required: true
  source_artifacts:
    required: true
    range: SourceArtifact
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  evidence_items:
    required: true
    range: EvidenceItem
    multivalued: true
    inlined: true
    inlined_as_list: true
    minimum_cardinality: 1
  adjudications:
    range: Adjudication
    multivalued: true
    inlined: true
    inlined_as_list: true
  requested_uses:
    required: true
    range: RequestedUse
    multivalued: true
    minimum_cardinality: 1
  statement_type:
    range: BreedStatementType
    required: true
  subject_label:
    range: SourceBreedLabel
    inlined: true
    required: true
  predicate:
    range: BreedPredicate
    required: true
  object_breed:
    range: BreedConcept
    inlined: true
    required: true
  value:
    range: string
    required: true
  source_name:
    range: string
    required: true
  source_record_ids:
    range: string
    multivalued: true
  candidate_concept_ids:
    required: true
    range: uriorcurie
    multivalued: true
    minimum_cardinality: 1
  source_scope:
    required: true
    range: string
    multivalued: true
    minimum_cardinality: 1
  scope_hint:
    range: BreedScope
  genotype_membership_verified:
    range: boolean
  concept_id:
    identifier: true
    range: uriorcurie
    required: true
  preferred_name:
    range: string
    required: true
  ontology:
    range: string
    required: true
  ontology_version:
    range: string
    required: true
  concept_status:
    range: BreedConceptStatus
    required: true
  breed_scope:
    range: BreedScope
    required: true
  scope_flags:
    range: string
    multivalued: true

classes:
  SourceBreedLabel:
    slots:
      - value
      - source_name
      - source_record_ids
      - candidate_concept_ids
      - source_scope
      - scope_hint
      - genotype_membership_verified

  BreedConcept:
    slots:
      - concept_id
      - preferred_name
      - ontology
      - ontology_version
      - concept_status
      - breed_scope
      - scope_flags

  BreedStatement:
    is_a: Statement
    slots:
      - statement_type
      - subject_label
      - predicate
      - object_breed

  CanineBreedRecord:
    tree_root: true
    slots:
      - record_id
      - statement
      - source_artifacts
      - evidence_items
      - adjudications
      - requested_uses
