name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked project
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check --output-format github .
      - name: Type-check
        run: uv run --frozen mypy

  verify:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked project
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Run tests with coverage (minimum in pyproject.toml)
        run: uv run --frozen pytest --cov --cov-report=term
      - name: Coverage summary
        if: always()
        shell: bash
        run: uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Build distributable
        run: uv build
      - name: Verify installed wheel and CLI outside editable source
        shell: bash
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with ./dist/*.whl python tools/check_distribution.py

  action:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Admitted and review-required drafts pass with fail-on rejected
        id: drafts
        uses: ./
        with:
          files: examples/drafts/*claim.yaml
          profile: literature-claim
          format: draft
          fail-on: rejected
      - name: A rejected record fails the action
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          files: examples/dataset_label/*.json
          profile: dataset-label
      - name: Check action outcomes and outputs
        shell: bash
        run: |
          test "${{ steps.drafts.outputs.admitted }}" = 1
          test "${{ steps.drafts.outputs.review_required }}" = 1
          test "${{ steps.rejected.outcome }}" = failure
          test "${{ steps.rejected.outputs.rejected }}" = 1
