name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked project
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Run tests
        run: uv run --frozen pytest
      - name: Build distributable
        run: uv build
      - name: Verify installed wheel and CLI outside editable source
        run: uv run --isolated --no-project --python ${{ matrix.python }} --with ./dist/bioai_evidence_validator-0.4.0-py3-none-any.whl python tools/check_distribution.py
