name: Repository checks
on:
  push:
    branches: [main, codex/evidence-library-integration-public]
  pull_request:
permissions:
  contents: read
env:
  EVIDENCE_LIBRARY_COMMIT: ed5dd1826becca992a7e9f0bf5474f90b9c1df4d
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked project
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check --output-format github .
      - name: Type-check
        run: uv run --frozen mypy

  reproduce:
    # Every committed benchmark table, summary and figure, regenerated offline and compared with the repository.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked project
        run: uv sync --frozen --extra dev
      - name: Reproduce every result and figure
        run: uv run --frozen --with matplotlib==3.11.2 python tools/reproduce.py

  verify:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked tooling
        run: python -m pip install uv==0.12.17
      - name: Install locked project
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      # Publish the evidence repository and this exact commit before this branch.
      - name: Require an immutable evidence library commit
        run: python -c "import os, re; assert re.fullmatch(r'[0-9a-f]{40}', os.environ['EVIDENCE_LIBRARY_COMMIT']), 'Pin the published evidence library commit before enabling this workflow'"
      - name: Check out the pinned independent evidence library
        uses: actions/checkout@v4
        with:
          repository: NingyuSUN/evidport
          ref: ${{ env.EVIDENCE_LIBRARY_COMMIT }}
          path: artifacts/evidence-library-ci
          persist-credentials: false
      - name: Install the independent library and its locked PDF test dependencies
        shell: bash
        run: |
          uv export --project artifacts/evidence-library-ci --frozen --extra pdf --no-dev --no-emit-project --output-file artifacts/evidence-library-pdf-requirements.txt
          uv pip install --no-deps --require-hashes --requirements artifacts/evidence-library-pdf-requirements.txt
          uv pip install --no-deps ./artifacts/evidence-library-ci
          uv pip check
      - name: Require the optional integration dependencies
        run: uv run --frozen --no-sync python -c "import evidence_database.store, evidence_database.acquisition, evidence_database.packets, pymupdf"
      - name: Run tests with coverage (minimum in pyproject.toml)
        run: uv run --frozen --no-sync pytest --cov --cov-report=term
      - name: Coverage summary
        if: always()
        shell: bash
        run: uv run --frozen --no-sync coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Build distributable
        run: uv build
      - name: Verify installed wheel and CLI outside editable source
        shell: bash
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file artifacts/wheel-requirements.txt
          uv run --isolated --no-project --python ${{ matrix.python }} --with ./dist/*.whl --with-requirements artifacts/wheel-requirements.txt python tools/check_distribution.py

  action:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Admitted and review-required drafts pass with fail-on rejected
        id: drafts
        uses: ./
        with:
          files: examples/drafts/*claim.yaml
          profile: literature-claim
          format: draft
          fail-on: rejected
      - name: A rejected record fails the action
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          files: examples/dataset_label/*.json
          profile: dataset-label
      - name: Check action outcomes and outputs
        shell: bash
        run: |
          test "${{ steps.drafts.outputs.admitted }}" = 1
          test "${{ steps.drafts.outputs.review_required }}" = 1
          test "${{ steps.rejected.outcome }}" = failure
          test "${{ steps.rejected.outputs.rejected }}" = 1
