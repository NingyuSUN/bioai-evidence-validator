[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bioai-evidence-validator"
version = "0.5.0"
description = "Standards-aligned evidence policy validation for AI-assisted biological curation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ningyu Sun" }]
keywords = [
  "bioinformatics", "biocuration", "evidence", "provenance", "llm",
  "ai-safety", "linkml", "knowledge-graph", "ontology", "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "linkml>=1.8,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.urls]
Homepage = "https://github.com/NingyuSUN/bioai-evidence-validator"
Documentation = "https://github.com/NingyuSUN/bioai-evidence-validator/tree/main/docs"
Changelog = "https://github.com/NingyuSUN/bioai-evidence-validator/blob/main/CHANGELOG.md"
Issues = "https://github.com/NingyuSUN/bioai-evidence-validator/issues"

[project.scripts]
bioevidence = "bioevidence_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bioevidence_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
