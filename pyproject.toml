[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bioai-evidence-validator"
version = "0.6.0"
description = "Standards-aligned evidence policy validation for AI-assisted biological curation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ningyu Sun" }]
keywords = [
  "bioinformatics", "biocuration", "evidence", "provenance", "llm",
  "ai-safety", "linkml", "knowledge-graph", "ontology", "validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "linkml>=1.8,<2",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "types-PyYAML",
  "types-jsonschema",
  "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/NingyuSUN/bioai-evidence-validator"
Documentation = "https://ningyusun.github.io/bioai-evidence-validator/"
Changelog = "https://github.com/NingyuSUN/bioai-evidence-validator/blob/main/CHANGELOG.md"
Issues = "https://github.com/NingyuSUN/bioai-evidence-validator/issues"

[project.scripts]
bioevidence = "bioevidence_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bioevidence_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["bioevidence_validator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples/quickstart.ipynb"]

[tool.ruff.lint]
# Correctness-focused rules. Style that the codebase uses deliberately (compact
# one-line statements in tests and benchmark scripts) is not policed.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = ["E701", "E702", "E731"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["linkml.*"]
ignore_missing_imports = true
