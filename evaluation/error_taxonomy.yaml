# Failure modes of AI-assisted biological curation, and which layer is expected to catch each.
# Rendered to docs/ERROR_TAXONOMY.md by tools/render_taxonomy.py; tests/test_error_taxonomy.py checks
# that every controlled fault in the benchmarks is mapped exactly once, that cited rule codes exist,
# and that each status agrees with the committed benchmark results.
version: 1

stages:
  source: The cited source itself is wrong, missing, changed or withdrawn.
  extraction: The AI misreads or misrepresents what the source says.
  provenance: The record misdescribes where evidence came from or how it was produced.
  aggregation: Evidence is combined or selected in a way that hides what it really supports.
  review: The human reference used to judge everything else is itself unreliable.

layers:
  deterministic: Fixed engine rules over the supplied record (offline, reproducible).
  grounding: Checks recomputed from the source itself (identifiers, bytes, quotes, completeness).
  model_review: Independent model or agent review; weak evidence on its own.
  human_review: Expert review, blinded, with measured agreement.
  attestation: Signed statements from a trusted pipeline about how evidence was produced.
  process: Study design (blinding, pre-registration) rather than a runtime check.

# Statuses are judged on the validator with grounding (checks recomputed from pinned source snapshots);
# the rendered page also shows what the rules alone admit.
statuses:
  caught: Every controlled case of this failure is refused or sent to review by the validator with grounding.
  partial: Controlled or tested forms are caught; a described form is not yet covered.
  exposed: Controlled cases show it is NOT caught today, even with grounding; a measured trust-boundary gap.
  uncovered: No negative control yet; the planned work will add one.

failure_modes:
  - id: SRC-1
    name: Fabricated source identifier
    stage: source
    definition: The record cites an identifier (ontology term, accession, PMID, DOI) that does not exist in the source.
    example: A dog-name mapping whose target VBO term does not exist in the pinned release.
    catch_layers: [grounding]
    status: partial
    rule_codes: [BEV016]
    negative_controls: [vbo:falsified_target]
    note: Grounding checks identifiers against pinned snapshots (VBO terms; ClinVar variants and submissions, where an invented submission is also rejected).
    uncovered_form: Literature identifiers (PMID, DOI) have no pinned snapshot or grounder yet.
    planned: ["#20"]

  - id: SRC-2
    name: Misattributed source
    stage: source
    definition: A real identifier is cited, but the claim or quote comes from a different source.
    example: A correct PMID for an unrelated paper attached to a gene–disease claim.
    catch_layers: [grounding]
    status: uncovered
    rule_codes: []
    negative_controls: []
    planned: ["#20"]

  - id: SRC-3
    name: Retracted or superseded source
    stage: source
    definition: The cited source has been retracted, corrected or replaced by a newer version.
    example: A claim resting on a paper retracted after the extraction was made.
    catch_layers: [grounding]
    status: uncovered
    rule_codes: []
    negative_controls: []
    planned: ["#20"]

  - id: SRC-4
    name: Source bytes changed
    stage: source
    definition: The bytes used differ from the frozen snapshot the record names.
    example: An observed source hash that differs from the record's frozen hash.
    catch_layers: [deterministic, grounding]
    status: caught
    rule_codes: [BEV002, BEV014, BEV015]
    negative_controls: [vbo:source_hash_mismatch, clinvar:source_hash_mismatch, vbo:unpinned_source]
    note: The engine compares the hashes a record supplies (BEV002). Grounding recomputes them from the snapshot store, so consistent but false hashes are caught too; bytes that are missing go to review (BEV015) and bytes that differ are rejected (BEV014).
    planned: []

  - id: EXT-1
    name: Fabricated or altered quote
    stage: extraction
    definition: The extracted text does not appear in the source, or was reworded so its meaning changed.
    example: A quote that reads "strongly associated" where the source says "may be associated".
    catch_layers: [grounding]
    status: uncovered
    rule_codes: []
    negative_controls: []
    planned: ["#20"]

  - id: EXT-2
    name: Polarity error
    stage: extraction
    definition: A negative or contradicting finding is extracted as supporting.
    example: '"No association was observed between X and Y" extracted as X associated_with Y.'
    catch_layers: [grounding, model_review, human_review]
    status: uncovered
    rule_codes: []
    negative_controls: []
    planned: ["#20", "#21"]

  - id: EXT-3
    name: Certainty inflation
    stage: extraction
    definition: A hedged, speculative or preliminary statement is extracted as an asserted finding.
    example: '"These data suggest a possible role" extracted as an established association.'
    catch_layers: [model_review, human_review]
    status: uncovered
    rule_codes: []
    negative_controls: []
    planned: ["#21"]

  - id: EXT-4
    name: Scope error
    stage: extraction
    definition: Evidence about one species, population, tissue or origin is used for another.
    example: A somatic finding supporting a germline classification; a mouse result supporting a human claim.
    catch_layers: [deterministic, grounding]
    status: partial
    rule_codes: [BEV005]
    negative_controls: [vbo:scope_mismatch, clinvar:somatic_scope]
    uncovered_form: When the record's scope tokens are wrong but consistent with each other, only a check against the source text (e.g. the species it mentions) can catch it.
    planned: ["#20"]

  - id: EXT-5
    name: Entity resolution error
    stage: extraction
    definition: A named entity is mapped to the wrong identifier, or to one of several candidates without evidence that the choice is unique.
    example: An ambiguous dog name mapped to one of two VBO terms without uniqueness evidence.
    catch_layers: [deterministic, grounding]
    status: partial
    rule_codes: [BEV007, BEV017]
    negative_controls: [vbo:missing_uniqueness, vbo:wrong_existing_target]
    note: For exact-name mappings, grounding recomputes the candidates from the pinned ontology, so a real but wrong target is rejected.
    uncovered_form: An entity resolved from free text needs the source passage to check the mention against.
    planned: ["#20", "#21"]

  - id: EXT-6
    name: Relation error
    stage: extraction
    definition: The wrong relation is extracted, e.g. association stated as causation, or a predicate the evidence does not support.
    example: '"Carriers had higher risk" extracted as "variant causes disease".'
    catch_layers: [deterministic, model_review, human_review]
    status: uncovered
    rule_codes: [BEV003]
    negative_controls: []
    note: Predicates outside a profile's allowlist are rejected (BEV003, unit-tested), but an allowed yet wrong predicate has no negative control.
    planned: ["#21"]

  - id: PRV-1
    name: Extraction method misreported
    stage: provenance
    definition: The record claims manual curation or deterministic parsing for evidence produced by a model.
    example: LLM output submitted with extraction_method manual_curation.
    catch_layers: [attestation]
    status: uncovered
    rule_codes: []
    negative_controls: []
    note: The engine trusts the declared method; profiles and draft docs require the pipeline, not the model, to set it.
    planned: ["future: signed pipeline attestations"]

  - id: PRV-2
    name: Weak support masked
    stage: provenance
    definition: A required evidence type rests only on LLM or string-match output, padded with unrelated stronger evidence so the record looks well supported.
    example: An LLM-only classification plus a manually curated note of another type.
    catch_layers: [deterministic]
    status: caught
    rule_codes: [BEV008, BEV009, BEV013]
    negative_controls: [vbo:required_llm_plus_note, vbo:required_string_plus_note, vbo:required_mixed_weak_plus_note,
                        vbo:weak_unique_resolution, clinvar:llm_classification_plus_note,
                        clinvar:string_match_classification_plus_note, clinvar:mixed_weak_classification_plus_note,
                        clinvar:llm_derived_review]
    planned: []

  - id: PRV-3
    name: Fabricated review
    stage: provenance
    definition: The record claims an expert or human review that did not happen, or relabels weak evidence as reviewed.
    example: No-criteria ClinVar submissions relabelled as criteria-based, with an invented expert-panel review.
    catch_layers: [grounding, attestation]
    status: partial
    rule_codes: [BEV017]
    negative_controls: [clinvar:fabricated_expert_review]
    note: Grounding rebuilds review tiers from the pinned ClinVar sample, so relabelled submissions and invented expert reviews are rejected.
    uncovered_form: A review claimed outside any pinned source (e.g. a curator's own sign-off) can only be checked by a signed attestation.
    planned: ["future: signed pipeline attestations"]

  - id: PRV-4
    name: Broken record integrity
    stage: provenance
    definition: References dangle, required evidence is missing, or the record is structurally invalid.
    example: An evidence item pointing to a source that is not in the record.
    catch_layers: [deterministic]
    status: caught
    rule_codes: [SCHEMA, RECORD_INTEGRITY, BEV007]
    negative_controls: [vbo:dangling_reference, clinvar:dangling_reference, clinvar:missing_derived_review]
    planned: []

  - id: AGG-1
    name: Unresolved conflict
    stage: aggregation
    definition: Contradicting evidence is present but the claim is admitted as if it were settled.
    example: A pathogenic classification admitted despite a criteria-based uncertain-significance submission.
    catch_layers: [deterministic]
    status: caught
    rule_codes: [BEV004]
    negative_controls: [vbo:explicit_contradiction, clinvar:injected_dissent]
    note: In the ClinVar population, 1★ P/LP variants with a dissenting submission were reclassified or put in conflict within three years 13.77% of the time, against 2.63% without.
    planned: []

  - id: AGG-2
    name: Dissent omitted
    stage: aggregation
    definition: Contradicting evidence that exists in the source is left out of the record entirely.
    example: An importer or agent that drops the one submission disagreeing with the rest.
    catch_layers: [grounding]
    status: partial
    rule_codes: [BEV018]
    negative_controls: [clinvar:omitted_dissent]
    note: The engine can only act on dissent it is shown. Grounding lists every submission for the variant in the pinned sample and sends a record that leaves one out to review.
    uncovered_form: Completeness is checked only where a grounder can enumerate the source (structured registries); dissent omitted from free text is not.
    planned: ["#20"]

  - id: AGG-3
    name: Withdrawn statement reused
    stage: aggregation
    definition: A statement already rejected or superseded is admitted again.
    example: A superseded mapping resubmitted for catalog use.
    catch_layers: [deterministic]
    status: caught
    rule_codes: [BEV001]
    negative_controls: [vbo:withdrawn_statement, clinvar:withdrawn_statement]
    planned: []

  - id: AGG-4
    name: Correlated model consensus
    stage: aggregation
    definition: Agreement among several models is treated as independent confirmation although their errors are correlated.
    example: Three models all accepting a claim none of them checked against the source.
    catch_layers: [process, model_review]
    status: uncovered
    rule_codes: []
    negative_controls: []
    note: By design, model-produced evidence is typed as LLM output and cannot be a required type's only support (BEV008); error correlation is not yet measured.
    planned: ["#22"]

  - id: REV-1
    name: Reviewer exposure
    stage: review
    definition: A human reviewer sees validator or model outputs, the aggregate status, or later outcomes before labelling.
    example: A reviewer looking up the variant's current ClinVar page.
    catch_layers: [process]
    status: partial
    rule_codes: []
    negative_controls: []
    note: The review packet is tested to contain no identifiers, aggregate status or outputs; reviewers self-report later information. Look-ups outside the packet cannot be prevented.
    uncovered_form: Exposure outside the packet is only self-reported.
    planned: ["#23"]

  - id: REV-2
    name: Unreliable reference labels
    stage: review
    definition: Expert labels disagree too much, or reflect one reviewer's view, to serve as a reference.
    example: Two reviewers agreeing barely above chance on clinical-reference admission.
    catch_layers: [human_review, process]
    status: uncovered
    rule_codes: []
    negative_controls: []
    note: Agreement is measured with bioevidence review agreement; no expert labels exist yet.
    planned: ["#23"]
