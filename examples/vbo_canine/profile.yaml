id: vbo-canine-name
version: "1.0.0"
description: Automatic unambiguous dog-name mapping within a pinned VBO release; not genotype or breed-status verification.
predicates: [maps_to_ontology_term]
subject_types: [source_name]
object_types: [ontology_term]
uses:
  reference_catalog:
    required_evidence_types: [ontology_name_assertion, unique_label_resolution]
    require_human_acceptance: false
    allow_llm_only: false
    allow_string_match_only: false
